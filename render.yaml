services:
  - type: web
    name: pbl-mental-health
    env: node
    plan: free
    buildCommand: npm install && npm run build && npm run db:push
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pbl-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: AI_INTEGRATIONS_OPENAI_API_KEY
        sync: false # User will set this manually in the dashboard
      - key: AI_INTEGRATIONS_OPENAI_BASE_URL
        value: https://openrouter.ai/api/v1

databases:
  - name: pbl-db
    plan: free
